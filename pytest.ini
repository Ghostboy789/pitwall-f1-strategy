[pytest]
testpaths = tests
addopts = -q
# Make the project importable without installing it.
#
# Locally `python -m pytest` puts the working directory on sys.path, which
# hides the problem; bare `pytest` on a clean clone does not, and CI failed
# with ModuleNotFoundError on the first push. This is the fix, and it is the
# reason CI runs bare `pytest` rather than `python -m pytest`.
pythonpath = .
